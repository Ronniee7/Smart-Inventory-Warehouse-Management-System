[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot-backend"
version = "0.1.0"
description = "StockPilot backend API"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "djangorestframework>=3.15,<3.17",
    "django-environ>=0.11,<0.13",
    "django-cors-headers>=4.4,<4.7",
    "drf-spectacular>=0.27,<0.29",
    "psycopg[binary]>=3.2,<3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
